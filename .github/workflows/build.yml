name: Build SmartGallery APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f SmartGallery.zip
          unzip -q SmartGallery.zip
          test -f SmartGallery/settings.gradle.kts
          ls -a SmartGallery

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: SmartGallery
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-debug
          path: SmartGallery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
