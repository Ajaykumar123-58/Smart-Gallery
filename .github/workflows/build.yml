name: Build SmartGallery APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (SmartGallery.zip -> SmartGallery/)
        run: |
          test -f SmartGallery.zip
          unzip -q SmartGallery.zip
          test -f SmartGallery/settings.gradle.kts
          ls -a SmartGallery

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Tests must not block the APK; their result is shown in the Summary.
      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: SmartGallery
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee ../test.log

      - name: Build debug APK
        working-directory: SmartGallery
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-debug-apk
          path: SmartGallery/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show errors in Summary
        if: always()
        run: |
          {
            echo "## Result summary"
            echo "Unit tests: ${{ steps.tests.outcome }}"
            for f in build.log test.log; do
              if [ -f "$f" ]; then
                echo "### Errors from $f"
                echo '```'
                grep -nE "^e: |Unresolved reference|Execution failed|What went wrong|FAILED|Could not (resolve|find|determine)|error:" "$f" | head -40 || true
                sed -n '/What went wrong/,/^\* Try/p' "$f" | head -30
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            SmartGallery/app/build/reports/
          if-no-files-found: ignore
